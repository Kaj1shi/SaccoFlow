<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaccoFlow - Audit Logs</title>
<script src="https://kit.fontawesome.com/8ec4e20c05.js" crossorigin="anonymous"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Audit Logs Styles */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1a3a6b;
  --secondary: #6b7f96;
  --success: #16a34a;
  --warning: #d97706;
  --danger: #dc2626;
  --info: #2563eb;
  --light: #f8fafc;
  --border: #e5e7eb;
  --text: #1e293b;
  --bg: #ffffff;
}
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--light);
  color: var(--text);
  line-height: 1.6;
}
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
}
.header {
  background: var(--bg);
  padding: 30px 0;
  margin-bottom: 30px;
  border-bottom: 2px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.header h1 {
  font-family: 'Sora', sans-serif;
  font-size: 2rem;
  font-weight: 700;
  color: var(--primary);
  margin: 0;
}
.controls {
  background: var(--bg);
  padding: 25px;
  border-radius: 12px;
  border: 1px solid var(--border);
  margin-bottom: 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
}
.search-box {
  display: flex;
  align-items: center;
  background: var(--light);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 15px;
  flex: 1;
  max-width: 400px;
}
.search-box input {
  border: none;
  background: transparent;
  outline: none;
  width: 100%;
  font-size: 1rem;
}
.search-box svg {
  color: var(--secondary);
  margin-right: 10px;
}
.filter-buttons {
  display: flex;
  gap: 10px;
}
.date-range {
  display: flex;
  gap: 15px;
  align-items: center;
}
.date-range input {
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 1rem;
}
.date-range label {
  font-weight: 500;
  color: var(--text);
}
.export-btn {
  background: var(--success);
  color: white;
}
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary {
  background: var(--primary);
  color: white;
}
.btn-secondary {
  background: var(--secondary);
  color: white;
}
.btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
}
.btn-outline:hover {
  background: var(--light);
}
.btn-outline.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.audit-table {
  background: var(--bg);
  border-radius: 12px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.table-header {
  background: var(--light);
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.table-title {
  font-family: 'Sora', sans-serif;
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--primary);
}
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 15px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
th {
  background: var(--light);
  font-weight: 600;
  color: var(--text);
}
.status-badge {
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
}
.status-success { background: var(--success); color: white; }
.status-failed { background: var(--danger); color: white; }
.status-warning { background: var(--warning); color: white; }
.action-badge {
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
}
.action-login { background: var(--info); color: white; }
.action-approval { background: var(--success); color: white; }
.action-suspension { background: var(--warning); color: white; }
.action-security { background: var(--danger); color: white; }
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-top: 20px;
}
.pagination button {
  padding: 8px 16px;
  border: 1px solid var(--border);
  background: var(--bg);
  cursor: pointer;
  border-radius: 6px;
}
.pagination button:hover {
  background: var(--light);
}
.pagination button.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Audit Logs</h1>
    <button class="btn export-btn" onclick="exportLogs()">📥 Export Logs</button>
  </div>

  <div class="controls">
    <div class="search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-2.65"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search logs..." oninput="searchLogs(this.value)">
    </div>
    <div class="filter-buttons">
      <button class="btn-outline active" onclick="filterLogs('all')">All Logs</button>
      <button class="btn-outline" onclick="filterLogs('security')">Security</button>
      <button class="btn-outline" onclick="filterLogs('admin')">Admin Actions</button>
      <button class="btn-outline" onclick="filterLogs('system')">System</button>
    </div>
    <div class="date-range">
      <label>From:</label>
      <input type="datetime-local" id="startDateTime">
      <label>To:</label>
      <input type="datetime-local" id="endDateTime">
    </div>
  </div>

  <div class="audit-table">
    <div class="table-header">
      <h2 class="table-title">System Activity Logs</h2>
      <div class="filter-buttons">
        <button class="btn btn-secondary" onclick="refreshLogs()">🔄 Refresh</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>User</th>
          <th>Action</th>
          <th>Resource</th>
          <th>IP Address</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="auditLogsTableBody">
        <tr>
          <td colspan="6" style="text-align: center; padding: 40px; color: var(--secondary);">
            Loading audit logs...
          </td>
        </tr>
      </tbody>
    </table>
    
    <div class="pagination" id="pagination">
      <button onclick="previousPage()">← Previous</button>
      <span id="pageInfo">Page 1 of 1</span>
      <button onclick="nextPage()">Next →</button>
    </div>
  </div>
</div>

<script>
let allLogs = [];
let filteredLogs = [];
let currentPage = 1;
const logsPerPage = 50;

// Sample audit logs data (in real implementation, this would come from database)
const sampleLogs = [
  {
    id: 1,
    timestamp: new Date().toISOString(),
    user: 'Super Admin',
    action: 'LOGIN',
    resource: 'Dashboard',
    ip_address: '192.168.1.100',
    status: 'SUCCESS',
    category: 'security'
  },
  {
    id: 2,
    timestamp: new Date(Date.now() - 3600000).toISOString(),
    user: 'John Doe',
    action: 'SACCO_APPROVAL',
    resource: 'Hope Microfinance',
    ip_address: '192.168.1.101',
    status: 'SUCCESS',
    category: 'admin'
  },
  {
    id: 3,
    timestamp: new Date(Date.now() - 7200000).toISOString(),
    user: 'Jane Smith',
    action: 'USER_SUSPENSION',
    resource: 'User #1234',
    ip_address: '192.168.1.102',
    status: 'SUCCESS',
    category: 'admin'
  },
  {
    id: 4,
    timestamp: new Date(Date.now() - 10800000).toISOString(),
    user: 'System',
    action: 'DATABASE_BACKUP',
    resource: 'Production Database',
    ip_address: '127.0.0.1',
    status: 'SUCCESS',
    category: 'system'
  },
  {
    id: 5,
    timestamp: new Date(Date.now() - 14400000).toISOString(),
    user: 'Unknown User',
    action: 'FAILED_LOGIN_ATTEMPT',
    resource: 'Admin Dashboard',
    ip_address: '192.168.1.200',
    status: 'FAILED',
    category: 'security'
  }
];

async function loadAuditLogs() {
  try {
    console.log('Loading audit logs...');
    
    // In real implementation, fetch from Supabase:
    // const result = await window.SupabaseClient.select('audit_logs', {
    //   select: '*',
    //   orderBy: { column: 'timestamp', ascending: false }
    // });
    
    // For demo, use sample data
    allLogs = sampleLogs;
    filteredLogs = allLogs;
    
    renderLogsTable();
    updatePagination();
    
  } catch (error) {
    console.error('Error loading audit logs:', error);
    showToast('Error loading audit logs', 'error');
  }
}

function renderLogsTable() {
  const tbody = document.getElementById('auditLogsTableBody');
  
  if (filteredLogs.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="6" style="text-align: center; padding: 40px; color: var(--secondary);">
          No audit logs found
        </td>
      </tr>
    `;
    return;
  }
  
  const startIndex = (currentPage - 1) * logsPerPage;
  const endIndex = startIndex + logsPerPage;
  const pageLogs = filteredLogs.slice(startIndex, endIndex);
  
  tbody.innerHTML = pageLogs.map(log => `
    <tr>
      <td>${new Date(log.timestamp).toLocaleString()}</td>
      <td>${log.user}</td>
      <td><span class="action-badge action-${log.category}">${log.action}</span></td>
      <td>${log.resource}</td>
      <td>${log.ip_address}</td>
      <td><span class="status-badge status-${log.status.toLowerCase()}">${log.status}</span></td>
    </tr>
  `).join('');
}

function updatePagination() {
  const totalPages = Math.ceil(filteredLogs.length / logsPerPage);
  document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
  
  const pagination = document.getElementById('pagination');
  pagination.innerHTML = `
    <button onclick="previousPage()" ${currentPage === 1 ? 'disabled' : ''}>← Previous</button>
    <span>Page ${currentPage} of ${totalPages}</span>
    <button onclick="nextPage()" ${currentPage === totalPages ? 'disabled' : ''}>Next →</button>
  `;
}

function filterLogs(category) {
  console.log('Filtering logs by:', category);
  
  // Update active filter button
  document.querySelectorAll('.filter-buttons .btn-outline').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  
  // Filter logs
  if (category === 'all') {
    filteredLogs = allLogs;
  } else {
    filteredLogs = allLogs.filter(log => log.category === category);
  }
  
  currentPage = 1;
  renderLogsTable();
  updatePagination();
  
  showToast(`Filtering logs: ${category}`, 'info');
}

function searchLogs(query) {
  const searchTerm = query.toLowerCase();
  
  if (searchTerm === '') {
    filteredLogs = allLogs;
  } else {
    filteredLogs = allLogs.filter(log => 
      log.user.toLowerCase().includes(searchTerm) ||
      log.action.toLowerCase().includes(searchTerm) ||
      log.resource.toLowerCase().includes(searchTerm) ||
      log.ip_address.includes(searchTerm)
    );
  }
  
  currentPage = 1;
  renderLogsTable();
  updatePagination();
}

function previousPage() {
  if (currentPage > 1) {
    currentPage--;
    renderLogsTable();
    updatePagination();
  }
}

function nextPage() {
  const totalPages = Math.ceil(filteredLogs.length / logsPerPage);
  if (currentPage < totalPages) {
    currentPage++;
    renderLogsTable();
    updatePagination();
  }
}

function refreshLogs() {
  console.log('Refreshing audit logs...');
  showToast('Refreshing audit logs...', 'info');
  loadAuditLogs();
}

function exportLogs() {
  console.log('Exporting audit logs...');
  showToast('Exporting audit logs...', 'info');
  
  // Create CSV content
  const csvContent = [
    ['Timestamp', 'User', 'Action', 'Resource', 'IP Address', 'Status', 'Category'],
    ...filteredLogs.map(log => [
      new Date(log.timestamp).toISOString(),
      log.user,
      log.action,
      log.resource,
      log.ip_address,
      log.status,
      log.category
    ])
  ].map(row => row.join(',')).join('\n');
  
  // Download CSV
  const blob = new Blob([csvContent], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `audit_logs_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  
  showToast('Audit logs exported successfully!', 'success');
}

function applyDateTimeFilter() {
  const startDateTime = document.getElementById('startDateTime').value;
  const endDateTime = document.getElementById('endDateTime').value;
  
  if (startDateTime && endDateTime) {
    console.log('Date time filter:', startDateTime, 'to', endDateTime);
    
    const startDate = new Date(startDateTime);
    const endDate = new Date(endDateTime);
    
    filteredLogs = allLogs.filter(log => {
      const logDate = new Date(log.timestamp);
      return logDate >= startDate && logDate <= endDate;
    });
    
    currentPage = 1;
    renderLogsTable();
    updatePagination();
    
    showToast(`Applied date filter`, 'info');
  }
}

// Toast notification function
function showToast(message, type = 'info') {
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = message;
  toast.style.cssText = `
    position: fixed;
    top: 20px;
    right: 20px;
    background: ${type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--danger)' : 'var(--primary)'};
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    z-index: 1000;
    opacity: 0;
    transform: translateX(100%);
    transition: all 0.3s ease;
  `;
  
  document.body.appendChild(toast);
  
  setTimeout(() => {
    toast.style.opacity = '1';
    toast.style.transform = 'translateX(0)';
  }, 100);
  
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100%)';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// Initialize page
document.addEventListener('DOMContentLoaded', function() {
  loadAuditLogs();
  
  // Add date filter listeners
  document.getElementById('startDateTime').addEventListener('change', applyDateTimeFilter);
  document.getElementById('endDateTime').addEventListener('change', applyDateTimeFilter);
  
  // Auto-refresh every 30 seconds
  setInterval(loadAuditLogs, 30000);
});
</script>
</body>
</html>
