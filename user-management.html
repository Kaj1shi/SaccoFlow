<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaccoFlow - User Management</title>
<script src="https://kit.fontawesome.com/8ec4e20c05.js" crossorigin="anonymous"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* User Management Styles */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1a3a6b;
  --secondary: #6b7f96;
  --success: #16a34a;
  --warning: #d97706;
  --danger: #dc2626;
  --info: #2563eb;
  --light: #f8fafc;
  --border: #e5e7eb;
  --text: #1e293b;
  --bg: #ffffff;
}
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--light);
  color: var(--text);
  line-height: 1.6;
}
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
}
.header {
  background: var(--bg);
  padding: 30px 0;
  margin-bottom: 30px;
  border-bottom: 2px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.header h1 {
  font-family: 'Sora', sans-serif;
  font-size: 2rem;
  font-weight: 700;
  color: var(--primary);
  margin: 0;
}
.header-actions {
  display: flex;
  gap: 15px;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}
.stat-card {
  background: var(--bg);
  padding: 25px;
  border-radius: 12px;
  border: 1px solid var(--border);
  text-align: center;
}
.stat-value {
  font-size: 2rem;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 8px;
}
.stat-label {
  color: var(--secondary);
  font-weight: 500;
}
.controls {
  background: var(--bg);
  padding: 30px;
  border-radius: 12px;
  border: 1px solid var(--border);
  margin-bottom: 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
}
.search-box {
  display: flex;
  align-items: center;
  background: var(--light);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 15px;
  flex: 1;
  max-width: 400px;
}
.search-box input {
  border: none;
  background: transparent;
  outline: none;
  width: 100%;
  font-size: 1rem;
}
.search-box svg {
  color: var(--secondary);
  margin-right: 10px;
}
.filter-buttons {
  display: flex;
  gap: 10px;
}
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary {
  background: var(--primary);
  color: white;
}
.btn-secondary {
  background: var(--secondary);
  color: white;
}
.btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
}
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}
.users-table {
  background: var(--bg);
  border-radius: 12px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.table-header {
  background: var(--light);
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.table-title {
  font-family: 'Sora', sans-serif;
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--primary);
}
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 15px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
th {
  background: var(--light);
  font-weight: 600;
  color: var(--text);
}
.role-badge {
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
}
.role-admin { background: var(--danger); color: white; }
.role-manager { background: var(--warning); color: white; }
.role-cashier { background: var(--info); color: white; }
.status-badge {
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
}
.status-active { background: var(--success); color: white; }
.status-inactive { background: var(--warning); color: white; }
.action-buttons {
  display: flex;
  gap: 8px;
}
.btn-sm {
  padding: 6px 12px;
  font-size: 0.9rem;
}
.btn-view { background: var(--info); color: white; }
.btn-suspend { background: var(--warning); color: white; }
.btn-activate { background: var(--success); color: white; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>User Management</h1>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="addNewUser()">+ Add User</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="totalUsers">0</div>
      <div class="stat-label">Total Users</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="activeUsers">0</div>
      <div class="stat-label">Active Users</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="suspendedUsers">0</div>
      <div class="stat-label">Suspended Users</div>
    </div>
  </div>

  <div class="controls">
    <div class="search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-2.65"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search users..." oninput="searchUsers(this.value)">
    </div>
    <div class="filter-buttons">
      <button class="btn btn-outline active" onclick="filterUsers('all')">All</button>
      <button class="btn btn-outline" onclick="filterUsers('admin')">Admins</button>
      <button class="btn btn-outline" onclick="filterUsers('manager')">Managers</button>
      <button class="btn btn-outline" onclick="filterUsers('cashier')">Cashiers</button>
    </div>
  </div>

  <div class="users-table">
    <div class="table-header">
      <h2 class="table-title">System Users</h2>
      <div class="filter-buttons">
        <button class="btn btn-sm btn-secondary" onclick="exportUsers()">📥 Export</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>SACCO</th>
          <th>Role</th>
          <th>Status</th>
          <th>Last Login</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        <tr>
          <td colspan="7" style="text-align: center; padding: 40px; color: var(--secondary);">
            Loading users...
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
let allUsers = [];
let filteredUsers = [];

async function loadUsers() {
  try {
    console.log('Loading users...');
    const result = await window.SupabaseClient.select('users', {
      select: 'id, first_name, last_name, email, role, is_active, last_login_at, created_at, institutions!inner(name) as sacco_name',
      orderBy: { column: 'created_at', ascending: false }
    });
    
    if (result.success) {
      allUsers = result.data;
      filteredUsers = allUsers;
      renderUsersTable();
      updateUserStats();
    } else {
      console.error('Failed to load users:', result.error);
      showToast('Failed to load users', 'error');
    }
  } catch (error) {
    console.error('Error loading users:', error);
    showToast('Error loading users', 'error');
  }
}

function renderUsersTable() {
  const tbody = document.getElementById('usersTableBody');
  
  if (filteredUsers.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="7" style="text-align: center; padding: 40px; color: var(--secondary);">
          No users found
        </td>
      </tr>
    `;
    return;
  }
  
  tbody.innerHTML = filteredUsers.map(user => `
    <tr>
      <td>${user.first_name} ${user.last_name}</td>
      <td>${user.email}</td>
      <td>${user.sacco_name || 'N/A'}</td>
      <td><span class="role-badge role-${user.role}">${user.role}</span></td>
      <td><span class="status-badge status-${user.is_active ? 'active' : 'inactive'}">${user.is_active ? 'Active' : 'Inactive'}</span></td>
      <td>${user.last_login_at ? new Date(user.last_login_at).toLocaleDateString() : 'Never'}</td>
      <td>
        <div class="action-buttons">
          <button class="btn btn-sm btn-view" onclick="viewUser('${user.id}')">View</button>
          <button class="btn btn-sm ${user.is_active ? 'btn-suspend' : 'btn-activate'}" onclick="toggleUserStatus('${user.id}', ${!user.is_active})">
            ${user.is_active ? 'Suspend' : 'Activate'}
          </button>
        </div>
      </td>
    </tr>
  `).join('');
}

function updateUserStats() {
  const totalUsers = allUsers.length;
  const activeUsers = allUsers.filter(u => u.is_active).length;
  const suspendedUsers = allUsers.filter(u => !u.is_active).length;
  
  document.getElementById('totalUsers').textContent = totalUsers;
  document.getElementById('activeUsers').textContent = activeUsers;
  document.getElementById('suspendedUsers').textContent = suspendedUsers;
}

function filterUsers(role) {
  // Update active filter button
  document.querySelectorAll('.filter-buttons .btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  
  // Filter users
  if (role === 'all') {
    filteredUsers = allUsers;
  } else {
    filteredUsers = allUsers.filter(user => user.role === role);
  }
  
  renderUsersTable();
}

function searchUsers(query) {
  const searchTerm = query.toLowerCase();
  
  if (searchTerm === '') {
    filteredUsers = allUsers;
  } else {
    filteredUsers = allUsers.filter(user => 
      user.first_name.toLowerCase().includes(searchTerm) ||
      user.last_name.toLowerCase().includes(searchTerm) ||
      user.email.toLowerCase().includes(searchTerm) ||
      (user.sacco_name && user.sacco_name.toLowerCase().includes(searchTerm))
    );
  }
  
  renderUsersTable();
}

function viewUser(userId) {
  console.log('Viewing user:', userId);
  showToast(`Viewing user details for ID: ${userId}`, 'info');
  // TODO: Open user details modal or navigate to user details page
}

function toggleUserStatus(userId, activate) {
  const action = activate ? 'activate' : 'suspend';
  if (confirm(`Are you sure you want to ${action} this user?`)) {
    showToast(`${action.charAt(0).toUpperCase() + action.slice(1)} user ${userId}`, 'info');
    // TODO: Update user status in database
  }
}

function addNewUser() {
  console.log('Adding new user...');
  showToast('Opening user creation form...', 'info');
  // TODO: Open user creation modal or navigate to user creation page
}

function exportUsers() {
  console.log('Exporting users...');
  showToast('Exporting user data...', 'info');
  
  // Create CSV content
  const csvContent = [
    ['Name', 'Email', 'SACCO', 'Role', 'Status', 'Last Login'],
    ...filteredUsers.map(user => [
      `${user.first_name} ${user.last_name}`,
      user.email,
      user.sacco_name || 'N/A',
      user.role,
      user.is_active ? 'Active' : 'Inactive',
      user.last_login_at || 'Never'
    ])
  ].map(row => row.join(',')).join('\n');
  
  // Download CSV
  const blob = new Blob([csvContent], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `users_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  
  showToast('User data exported successfully!', 'success');
}

// Toast notification function
function showToast(message, type = 'info') {
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = message;
  toast.style.cssText = `
    position: fixed;
    top: 20px;
    right: 20px;
    background: ${type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--danger)' : 'var(--primary)'};
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    z-index: 1000;
    opacity: 0;
    transform: translateX(100%);
    transition: all 0.3s ease;
  `;
  
  document.body.appendChild(toast);
  
  setTimeout(() => {
    toast.style.opacity = '1';
    toast.style.transform = 'translateX(0)';
  }, 100);
  
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100%)';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// Initialize page
document.addEventListener('DOMContentLoaded', function() {
  loadUsers();
  
  // Refresh data every 30 seconds
  setInterval(loadUsers, 30000);
});
</script>
</body>
</html>
